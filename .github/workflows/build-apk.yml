name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Download the offline European plate detector
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            "https://huggingface.co/0xnu/european-license-plate-recognition/resolve/main/model.onnx?download=true" \
            -o app/src/main/assets/plate-europe.onnx
          test "$(wc -c < app/src/main/assets/plate-europe.onnx)" -gt 1000000
          ls -lh app/src/main/assets/plate-europe.onnx
      - name: Download Ukrainian plate detector
        run: |
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            "https://huggingface.co/Murd0ck/LicensePlateDetector_YOLOv8n/resolve/main/best.onnx?download=true" \
            -o app/src/main/assets/plate-ukraine.onnx
          test "$(wc -c < app/src/main/assets/plate-ukraine.onnx)" -gt 1000000
          ls -lh app/src/main/assets/plate-ukraine.onnx
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANPR-AUTO-offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
